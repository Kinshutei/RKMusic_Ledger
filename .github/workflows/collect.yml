name: Collect

# cron-job.org が毎時0分に workflow_dispatch で起動する（入力なし＝auto）。
#   auto は日本時間の0時台なら daily（0時の全件）、それ以外は hourly（毎時の再生数）。
# 1:00（JST）の schedule は予備の実行（fill）。今日の daily が無ければ全件を取り、前日の値で埋めた分があれば取り直す。
# 予備を cron-job.org とは別の仕組みに置くのは、cron-job.org が止まった日にも動かすため
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto / daily / hourly / fill / test（daily と hourly を続けて動かし、保存しない） / alert-test（通知のテストだけ）'
        type: choice
        options: [auto, daily, hourly, fill, test, alert-test]
        default: auto
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write
  issues: write

# 前の回が長引いても重ならないよう、順番に動かす
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'schedule' && 'fill' || inputs.mode || 'auto' }}

    steps:
      # リポジトリ全体は取り込まない。最新のコミットの直下のファイルだけを取り出し、
      # daily/ と hourly/ は collect.py が読むときに1ファイルずつ git から取り出す
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect.py --mode "$MODE"

      # 失敗しても、書けた分は保存する。test は保存しない
      - name: Commit and push
        if: (success() || failure()) && env.MODE != 'test' && env.MODE != 'alert-test'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add --sparse -A
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Collect $MODE $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
